<mat-sidenav-container class="layout-container">
  <mat-sidenav #sidenav class="sidenav" [ngClass]="{ slim: isSlim }" mode="side" opened="true">
    <!-- LOGO -->
    <mat-toolbar class="sidenav-toolbar">
      <a routerLink="/allcases">
        <img src="assets/images/logo.png" class="logo" />
      </a>
    </mat-toolbar>

    <!-- USER INFO -->
    <div class="user-info">
      <img src="assets/images/avatar.jpg" class="user-avatar" />
      <div class="user-name">Nagapandi G</div>
      <div class="user-role">Admin</div>
    </div>

    <!-- NAVIGATION -->
    <mat-nav-list class="nav-list">
      <ng-template #recursiveMenu let-items let-level="level">
        <ng-container *ngFor="let item of items">
          <!-- ITEM WITHOUT CHILDREN -->
          <a
            *ngIf="!hasChildren(item)"
            mat-list-item
            class="nav-item"
            [ngClass]="['level-' + level, isMenuActive(item) ? 'active' : '']"
            [routerLink]="item.route"
            routerLinkActive="active"
            (click)="$event.stopPropagation()"
          >
            <mat-icon class="left-icon">{{ item.icon }}</mat-icon>
            <span class="label">{{ item.label }}</span>
          </a>

          <!-- ITEM WITH CHILDREN -->
          <div *ngIf="hasChildren(item)">
            <mat-list-item
              class="nav-item parent"
              [ngClass]="['level-' + level, isMenuActive(item) ? 'active' : '']"
              (click)="toggleMenu(item.key)"
            >
              <mat-icon class="left-icon">{{ item.icon }}</mat-icon>
              <span class="label">{{ item.label }}</span>

              <mat-icon class="right-icon" *ngIf="!isSlim">
                {{ openMenus[item.key] ? 'expand_more' : 'chevron_right' }}
              </mat-icon>
            </mat-list-item>

            <!-- SUB MENU -->
            <div class="sub-menu" *ngIf="openMenus[item.key] && !isSlim">
              <ng-container
                *ngTemplateOutlet="
                  recursiveMenu;
                  context: { $implicit: item.children, level: level + 1 }
                "
              ></ng-container>
            </div>
          </div>
        </ng-container>
      </ng-template>

      <!-- ROOT MENU CALL -->
      <ng-container
        *ngTemplateOutlet="recursiveMenu; context: { $implicit: menus, level: 1 }"
      ></ng-container>
    </mat-nav-list>
  </mat-sidenav>

  <!-- MAIN CONTENT -->
  <mat-sidenav-content class="main-content">
    <app-header (toggleSidebar)="toggleSidebarMode()"></app-header>
    <div class="content-wrapper">
      <app-breadcrumb></app-breadcrumb>
      <router-outlet></router-outlet>
    </div>
    <app-footer></app-footer>
  </mat-sidenav-content>
</mat-sidenav-container>
