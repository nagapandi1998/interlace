<app-loader [loading]="loading"></app-loader>

<div class="add-button">
  <!-- <input type="file" className="add-button" (change)="loadFile($event)"  /> -->
  <div class="file-upload-container">
    <input type="file" #fileInput (change)="loadFile($event)" style="display: none" />
    <button class="custom-file-upload-button" (click)="fileInput.click()">
      <mat-icon>download</mat-icon>
      Import Docx</button>
    <!-- <span class="selected-file-name">{{ selectedFileName || 'No file chosen' }}</span> -->
  </div>
  <button (click)="saveFile()">
    <mat-icon>upload</mat-icon>
     Export Docx</button>
</div>

<editor
  #editor
  apiKey="no-api-key"
  [init]="{
    height: 500,
    plugins: [
      'a11ychecker',
      'accordion',
      'advlist',
      'anchor',
      'autolink',
      'autosave',
      'charmap',
      'code',
      'codesample',
      'directionality',
      'emoticons',
      'exportpdf',
      'exportword',
      'help',
      'image',
      'importcss',
      'importword',
      'insertdatetime',
      'link',
      'lists',
      'markdown',
      'math',
      'media',
      'nonbreaking',
      'pagebreak',
      'preview',
      'quickbars',
      'save',
      'searchreplace',
      'table',
      'visualblocks',
      'visualchars',
      'wordcount'
    ],
    toolbar:
      'undo redo | accordion accordionremove | \
      importword exportword exportpdf | math | \
      blocks fontfamily fontsize | bold italic underline strikethrough | \
      align numlist bullist | link image | table media | \
      lineheight outdent indent | forecolor backcolor removeformat | \
      charmap emoticons | code fullscreen preview | save print | \
      pagebreak anchor codesample | ltr rtl',
    menubar: 'file edit view insert format tools table help'
  }"
></editor>
