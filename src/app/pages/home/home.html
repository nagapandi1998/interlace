<!-- Employee Table Section -->
<mat-card class="employee-table-card" appearance="outlined">

  <div class="home-container">
  <app-loader [loading]="loading"></app-loader>
  
  <div class="button-container">
    <button class="mat-button" (click)="navigateTo('materialform')">Angular Material</button>
    <button (click)="navigateTo('bootstrapform')">Ng Bootstrap</button>
  </div>
</div>

  <h2>Employee List</h2>

  <div class="table-container">
    <div class="table-responsive">
      <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z2">

        <!-- ID -->
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Emp ID</th>
          <td mat-cell *matCellDef="let row">{{ row.id }}</td>
        </ng-container>

        <!-- First Name -->
        <ng-container matColumnDef="firstName">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>First Name</th>
          <td mat-cell *matCellDef="let row">{{ row.firstName }}</td>
        </ng-container>

        <!-- Last Name -->
        <ng-container matColumnDef="lastName">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Last Name</th>
          <td mat-cell *matCellDef="let row">{{ row.lastName }}</td>
        </ng-container>

        <!-- Department -->
        <!-- <ng-container matColumnDef="department">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Department</th>
          <td mat-cell *matCellDef="let row">{{ row.department }}</td>
        </ng-container> -->

        <!-- Designation -->
        <ng-container matColumnDef="designation">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Designation</th>
          <td mat-cell *matCellDef="let row">{{ row.designation }}</td>
        </ng-container>

        <!-- Email -->
        <ng-container matColumnDef="officialMailId">
          <th mat-header-cell *matHeaderCellDef>Email</th>
          <td mat-cell *matCellDef="let row">{{ row.officialMailId }}</td>
        </ng-container>

        <!-- Status -->
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
          <td mat-cell *matCellDef="let row">
            <span [ngClass]="{'active-status': row.status === 'Active', 'inactive-status': row.status === 'Inactive'}">
              {{ row.status }}
            </span>
          </td>
        </ng-container>

        <!-- Header & Row definitions -->
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        <!-- Empty Row (No Data Found Message) -->
        <tr class="no-data-row" *matNoDataRow>
          <td [attr.colspan]="displayedColumns.length">
            <div class="no-data">
              <p>No employee data found</p>
            </div>
          </td>
        </tr>

      </table>
    </div>

    <mat-paginator [length]="dataSource.data.length" [pageSize]="5" [pageSizeOptions]="[5, 10, 20]"
      showFirstLastButtons>
    </mat-paginator>
  </div>
</mat-card>
