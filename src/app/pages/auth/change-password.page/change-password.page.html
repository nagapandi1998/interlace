<div class="login-container">
  <div class="login-card fade-in">
    <!-- Left Panel with Logo -->
    <div class="left-panel slide-in-left">
      <div class="decorative-circle circle-1"></div>
      <div class="decorative-circle circle-2"></div>

      <div class="left-content">
        <div class="logo-section">
          <div class="logo-container">
            <div class="logo-glow"></div>
            <img src="assets/images/dvac.png" class="logo" alt="DVAC Logo" />
          </div>
          <div class="title-section">
            <h1 class="main-title">DVAC</h1>
            <div class="description">
              <h2 class="system-title">Management System</h2>
              <p class="department-subtitle">Directorate of Vigilance & Anti-Corruption</p>
            </div>
          </div>
          <div class="decorative-line">
            <div class="line-segment"></div>
            <div class="dot"></div>
            <div class="line-segment"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Right Panel - Change Password Form -->
    <div class="right-panel">
      <div class="right-content">
        <div class="form-container">
          <div class="form-card">
            <!-- Form Header -->
            <div class="form-header">
              <h2 class="welcome-title">Change Password</h2>
              <!-- <p class="welcome-subtitle">Sign in to your account to continue</p> -->
            </div>
            <!-- <h2 class="welcome-title">Change Password</h2> -->
            <form [formGroup]="changeForm" (ngSubmit)="onSubmit()">
              <!-- Old Password -->
              <mat-form-field appearance="outline" class="form-field">
                <mat-label>Old Password</mat-label>
                <input
                  matInput
                  [type]="hideOld ? 'password' : 'text'"
                  formControlName="oldPassword"
                />
                <button mat-icon-button matSuffix type="button" (click)="hideOld = !hideOld">
                  <mat-icon>{{ hideOld ? 'visibility_off' : 'visibility' }}</mat-icon>
                </button>
                <mat-error *ngIf="changeForm.get('oldPassword')?.hasError('required')">
                  Old password is required
                </mat-error>
              </mat-form-field>

              <!-- New Password -->
              <mat-form-field appearance="outline" class="form-field">
                <mat-label>New Password</mat-label>
                <input
                  matInput
                  [type]="hideNew ? 'password' : 'text'"
                  formControlName="newPassword"
                />
                <button mat-icon-button matSuffix type="button" (click)="hideNew = !hideNew">
                  <mat-icon>{{ hideNew ? 'visibility_off' : 'visibility' }}</mat-icon>
                </button>
                <mat-error *ngIf="changeForm.get('newPassword')?.hasError('required')">
                  New password is required
                </mat-error>
                <mat-error *ngIf="changeForm.get('newPassword')?.hasError('minlength')">
                  Minimum 6 characters
                </mat-error>
              </mat-form-field>

              <!-- Confirm Password -->
              <mat-form-field appearance="outline" class="form-field">
                <mat-label>Confirm Password</mat-label>
                <input
                  matInput
                  [type]="hideConfirm ? 'password' : 'text'"
                  formControlName="confirmPassword"
                />
                <button
                  mat-icon-button
                  matSuffix
                  type="button"
                  (click)="hideConfirm = !hideConfirm"
                >
                  <mat-icon>{{ hideConfirm ? 'visibility_off' : 'visibility' }}</mat-icon>
                </button>
                <mat-error *ngIf=" changeForm.get('confirmPassword')?.touched && changeForm.hasError('mismatch')">
                  Passwords do not match
                </mat-error>
              </mat-form-field>

              <button type="submit" class="submit-button" [disabled]="loading">
                <span *ngIf="!loading">Change Password</span>
                <app-loader *ngIf="loading" size="small"></app-loader>
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
