<mat-card class="card-body" appearance="outlined">
  <app-loader [loading]="loading"></app-loader>

  <div>
    <div class="top-bar">
      <!-- Search Bar -->
      <mat-form-field class="search-field" appearance="outline">
        <mat-label>Search</mat-label>
        <input matInput (keyup)="applyFilter($event)" placeholder="Search users..." />
        <button class="search-btn" mat-icon-button matPrefix disabled>
          <mat-icon>search</mat-icon>
        </button>
      </mat-form-field>

      <!-- Add Button -->
      <div class="add-button">
        <button mat-raised-button color="primary" type="button" (click)="addUsers()">
          Add User
        </button>
      </div>
    </div>
    <div class="table-container">
      <div class="table-responsive">
        <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z2">
          <ng-container matColumnDef="username">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Username</th>
            <td mat-cell *matCellDef="let row">{{ row.username }}</td>
          </ng-container>

          <ng-container matColumnDef="roleName">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Role Name</th>
            <td mat-cell *matCellDef="let row">
              {{ getRoleNames(row.roles) }}
            </td>
          </ng-container>

          <ng-container matColumnDef="active">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Active</th>
            <td mat-cell *matCellDef="let row">
              <span class="status-badge" [ngClass]="row.active ? 'active' : 'inactive'">
                {{ row.active ? 'Active' : 'Inactive' }}
              </span>
            </td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td class="action-btn" mat-cell *matCellDef="let row">
              <button mat-icon-button matTooltip="Edit">
                <mat-icon fontSet="material-icons-outlined" class="edit-icon">edit</mat-icon>
              </button>
              <!-- <button mat-icon-button matTooltip="Delete">
                <mat-icon fontSet="material-icons-outlined" class="delete-icon">delete</mat-icon>
              </button> -->
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

          <!-- Empty Row (No Data Found Message) -->
          <tr class="mat-row no-data-row" *matNoDataRow>
            <td class="mat-cell" [attr.colspan]="displayedColumns.length" class="no-data-cell">
              No Users Found.
            </td>
          </tr>
        </table>
      </div>
      <mat-paginator
        [length]="dataSource.data.length"
        [pageSize]="10"
        [pageSizeOptions]="[5, 10, 20, 50]"
        showFirstLastButtons
      >
      </mat-paginator>
    </div>
  </div>
</mat-card>
